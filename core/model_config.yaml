# Terminator LLM Configuration & Optimization Strategy
# ========================================================

defaults:
  provider: "ollama"
  model: "qwen2.5:7b"
  quantization: "q4_0" # Force 4-bit quantization for speed/memory
  context_window: 4096 # Limit context to prevent OOM
  temperature: 0.7

inference_optimization:
  batch_size: 1 # For local use, keep batch size low latency
  gpu_layers: "auto" # Offload all possible layers to Metal/CUDA
  use_mmap: true
  use_mlock: false # Don't lock memory, allow swap if needed

models:
  fast_reasoning:
    name: "qwen2.5:7b"
    quantization: "q4_0"
  
  deep_reasoning:
    name: "deepseek-r1:8b"
    quantization: "q4_k_m"
  
  coding:
    name: "qwen2.5-coder:7b"
    quantization: "q5_k_m" # Higher precision for code

resource_limits:
  max_ram_percent: 70
  max_cpu_threads: 4
